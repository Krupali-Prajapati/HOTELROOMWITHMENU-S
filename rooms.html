<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Rooms - Krupali's Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fffaf9; }
    .navbar { background: #1d3557 !important; }
    .navbar-brand, .nav-link { color: white !important; font-weight: bold; }
    .room-card img { height: 250px; object-fit: cover; border-radius: 10px; cursor: pointer; }
    footer { background: #1d3557; color: white; text-align: center; padding: 10px; margin-top: 20px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg"style="background-color: #1d3557;">
  <div class="container">
    <a class="navbar-brand" href="index.html">Krupali's Hotel</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon text-white"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
        <li class="nav-item"><a class="nav-link" href="About.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="Rooms.html">Rooms</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Rooms Section -->
<div class="container my-5">
  <h2 class="text-danger text-center mb-4">Our Rooms</h2>
  <div class="row g-4">
    
    <!-- Deluxe Room -->
    <div class="col-md-4">
      <div class="card shadow room-card">
        <img src="https://ramyashotels.com/wp-content/uploads/2019/11/Deluxe-rooms-at-ramyas-hotels-trichy.webp" 
             class="card-img-top" alt="Deluxe Room" onclick="openModal(this)">
        <div class="card-body text-center">
          <h5 class="card-title">Deluxe Room</h5>
          <p class="card-text">AC • Free WiFi • TV • Breakfast Included</p>
        </div>
      </div>
    </div>

    <!-- Family Room -->
    <div class="col-md-4">
      <div class="card shadow room-card">
        <img src="https://saltstayz.com/wp-content/uploads/2023/05/Saltstayz-millennium-Near-Huda-City-Centre-4.jpg" 
             class="card-img-top" alt="Family Room" onclick="openModal(this)">
        <div class="card-body text-center">
          <h5 class="card-title">Family Room</h5>
          <p class="card-text">2 Beds • AC • Free WiFi • Mini Fridge</p>
        </div>
      </div>
    </div>

    <!-- Luxury Suite -->
    <div class="col-md-4">
      <div class="card shadow room-card">
        <img src="https://www.lakdi.com/cdn/shop/articles/Hotel_Guest_Room_Design_and_Color.webp?v=1734176624" 
             class="card-img-top" alt="Luxury Suite" onclick="openModal(this)">
        <div class="card-body text-center">
          <h5 class="card-title">Luxury Suite</h5>
          <p class="card-text">King Bed • AC • Free WiFi • Balcony View</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content bg-dark">
      <div class="modal-body d-flex justify-content-center align-items-center">
        <img id="modalImage" src="" class="img-fluid rounded shadow" alt="Room Image">
      </div>
      <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
    </div>
  </div>
</div>

<footer>
  <p>© 2025 Krupali's Hotel | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openModal(img) {
    document.getElementById('modalImage').src = img.src;
    var modal = new bootstrap.Modal(document.getElementById('imageModal'));
    modal.show();
  }
</script>
</body>
</html>
