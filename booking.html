<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krupali's Hotel - Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fffaf9; }
    .navbar { background: #d62828; }
    .navbar-brand, .nav-link { color: white !important; font-weight: bold; }
    .booking-form { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    footer { background: #d62828; color: white; text-align: center; padding: 10px; margin-top: 20px; }

    /* Overlay Success Popup */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .success-popup {
      width: 200px; height: 200px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: scaleUp 0.5s ease-in-out;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .success-popup h4 {
      margin-top: 10px;
      color: #28a745;
      font-weight: bold;
    }
    .checkmark {
      font-size: 60px;
      color: #28a745;
      animation: pop 0.5s ease forwards;
    }
    @keyframes scaleUp {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg" style="background-color: #1d3557;">
  <div class="container">
    <a class="navbar-brand" href="index.html">Krupali's Hotel</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon text-white"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
        <li class="nav-item"><a class="nav-link" href="About.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="Cotact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="Rooms.html">Rooms</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Booking Form -->
<div class="container my-5">
  <h2 class="text-danger text-center mb-4">Room Booking</h2>
  <div class="booking-form mx-auto col-md-6">
    <form id="bookingForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control" placeholder="Enter your phone number" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="Enter your email">
      </div>
      <div class="mb-3">
        <label class="form-label">Choose Rooms Option</label>
        <select class="form-select">
          <option value="dine-in">Deluxe Room</option>
          <option value="dine-in">Family Room</option>
          <option value="dine-in">Luxury Suite</option>
        </select>
      </div>
    
      
      <button type="submit" class="btn btn-danger w-100">Confirm Booking</button>
    </form>
  </div>
</div>

<!-- Success Popup -->
<div class="overlay"id="successOverlay">
  <div class="success-popup">
    <div class="checkmark">✔</div>
    <h4>SUCCESS</h4>
  </div>
</div>

<!-- Footer -->
<footer style="background-color: #1d3557;">
  <p>© 2025 Krupali's Hotel | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault(); // form actual submit hone se rokna
    document.getElementById("successOverlay").style.display = "flex";

    // 2.5 second ke baad overlay auto close ho jaye
    setTimeout(() => {
      document.getElementById("successOverlay").style.display = "none";
      document.getElementById("bookingForm").reset();
    }, 2500);
  });
</script>
</body>
</html>
